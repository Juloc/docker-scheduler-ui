name: Agent Fix Ruff

on:
  push:
    branches:
      - agent/fix-ruff-ci
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply focused fixes
        run: python .github/scripts/fix_ruff_ci.py

      - name: Apply Ruff automatic fixes
        run: ruff check app tests --fix --unsafe-fixes || true

      - name: Capture remaining Ruff violations
        run: ruff check app tests > .github/ruff-output.txt 2>&1 || true

      - name: Commit automatic fixes and report
        run: |
          rm .github/workflows/agent-fix-ruff.yml
          rm .github/scripts/fix_ruff_ci.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Ruff automatic fixes"
          git push
