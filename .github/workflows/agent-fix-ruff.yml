name: Agent Fix Ruff

on:
  push:
    branches:
      - agent/fix-ruff-ci

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply focused non-automatic fixes
        run: python .github/scripts/fix_ruff_ci.py

      - name: Apply Ruff fixes
        run: ruff check app tests --fix --unsafe-fixes

      - name: Verify Ruff
        run: ruff check app tests

      - name: Run tests
        run: pytest

      - name: Verify Python compilation
        run: python -m compileall -q app tests

      - name: Commit fixes and remove temporary automation
        run: |
          rm .github/workflows/agent-fix-ruff.yml
          rm .github/scripts/fix_ruff_ci.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Ruff violations"
          git push
